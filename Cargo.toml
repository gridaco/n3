[package]
name = "n3"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]
# This private application library owns the existing single test inventory.
doctest = false

[[bin]]
name = "n3"
path = "src/main.rs"
test = false

[dependencies]
base64 = "0.22.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
earcutr = "0.5.0"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
glam = "0.33.11"
gltf = { version = "1.4.1", default-features = false, features = [
  "utils",
  "names",
  "extensions",
  "extras",
  "KHR_lights_punctual",
  "KHR_materials_unlit",
  "KHR_texture_transform",
] }
image = { version = "=0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10.9"
wgpu = "30.0.1"
winit = "=0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
alacritty_terminal = "=0.26.0"
egui-winit = { version = "=0.36.2", default-features = false, features = [
  "clipboard",
  "links",
] }
libc = "0.2"
pollster = "1.0.1"
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
egui-winit = { version = "=0.36.2", default-features = false, features = [
  "links",
] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-time = "1.1.0"
web-sys = { version = "=0.3.106", features = [
  "AddEventListenerOptions",
  "console",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "Navigator",
  "Performance",
  "Storage",
  "StorageEvent",
  "WheelEvent",
  "Window",
] }

[dev-dependencies]
tobj = { version = "4.0.5", features = ["use_f64"] }

# egui-winit 0.36.2 implements only the native DroppedFile trait method.
# Preserve its input integration with a narrow WASM compatibility patch.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Keep local browser iteration quick without shipping Rust debug sections.
[profile.web]
inherits = "dev"
debug = false
strip = "debuginfo"
