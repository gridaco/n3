[package]
name = "doc-example-config"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Executable documentation consumers for a configuration CLI and serde_json"

[lib]
name = "config_demo"

[[bin]]
name = "config-demo"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
executable-docs = { path = "../doc-harness" }
tempfile = "=3.27.0"
