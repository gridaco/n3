name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu checks and documentation replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check, test, and replay documentation in the pinned Ubuntu renderer
        run: python3 tools/ci_runner.py ci

  macos-native:
    name: macOS bundle and native integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just using the repository Rust toolchain
        run: cargo install just --version 1.46.0 --locked
      - name: Build and verify the native app bundle and platform integration
        run: just ci-macos
