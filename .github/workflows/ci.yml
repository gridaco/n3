name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu checks and documentation replay
    runs-on: ubuntu-24.04
    # Allow cold builds plus the full guide replay through the software renderer.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check, test, and replay documentation in the pinned Ubuntu renderer
        env:
          N3_CI_FAILURE_ARTIFACTS: "1"
        run: python3 tools/ci_runner.py ci
      - name: Preserve exact renderer drift evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ubuntu-renderer-drift-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/ci/linux-amd64/home/docs-failure-artifacts
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

  macos-native:
    name: macOS bundle and native integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just using the repository Rust toolchain
        run: cargo install just --version 1.46.0 --locked
      - name: Build and verify the native app bundle and platform integration
        run: just ci-macos
