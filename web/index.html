<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N3</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; color: #222; font: 13px system-ui, sans-serif; }
      #editor { width: 100%; height: 100%; overflow: hidden; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
      #status[hidden] { display: none; }
      #error { position: fixed; inset: auto 12px 12px; padding: 8px 12px; background: #fff0eb; border: 1px solid #dba58f; border-radius: 5px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main id="editor" aria-label="Editor canvas"></main>
    <div id="status" role="status">Starting N3…</div>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
